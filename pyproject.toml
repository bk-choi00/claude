[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shippid"
version = "0.1.0"
description = "Ship P&ID (readable PDF) object extraction, Gemma 4 31B analysis and 3D model generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pymupdf>=1.24,<2.0",  # PyMuPDF 2.x requires Python >= 3.11
  "numpy>=1.24",
  "pydantic>=2.6",
  "httpx>=0.27",
  "networkx>=3.1",
  "shapely>=2.0",
  "trimesh>=4.0",
  "scipy>=1.10",
  "plotly>=5.18",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
shippid = "shippid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shippid = ["py.typed", "**/*.html", "**/*.json", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
